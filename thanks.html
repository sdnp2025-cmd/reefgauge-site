<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check your email — ReefGauge</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap">
<style>
  :root { --ink: #10233a; --ink-2: #3e5570; --accent: #5b4bc4; --coral: #ff6f61; --bg-a: #eef4fb; --bg-b: #dbe8f6; --bg-c: #e9e4f6; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--ink);
    font-family: 'Outfit', -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 17px; line-height: 1.55;
    background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 55%, var(--bg-c) 100%) fixed;
  }
  a { color: var(--accent); }
  .card { max-width: 520px; margin: 22px; padding: 34px 30px; text-align: center; background: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.9); border-radius: 22px; box-shadow: 0 18px 50px rgba(16,35,58,.12); display: grid; gap: 14px; justify-items: center; }
  .card img { width: 64px; height: 64px; border-radius: 14px; }
  h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -.015em; line-height: 1.1; }
  p { margin: 0; color: var(--ink-2); }
  .btn { display: inline-block; margin-top: 6px; font-weight: 800; padding: 12px 22px; border-radius: 14px; background: var(--coral); color: var(--ink); text-decoration: none; }
</style>
</head>
<body>
<main class="card">
  <img src="assets/icon.png" alt="" width="64" height="64">
  <h1>Almost there — check your email.</h1>
  <p>We've sent you a link to confirm your address. Tap it and you're on the list for launch news and the introductory price.</p>
  <p>Nothing after a few minutes? Look in spam or promotions, or write to <a href="mailto:admin@reefgauge.com">admin@reefgauge.com</a>.</p>
  <a class="btn" href="./">Back to ReefGauge</a>
</main>
</body>
</html>
